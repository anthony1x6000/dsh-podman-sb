name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm selfcheck
      # Provenance check that does not trust the tracked tsconfig: rebuild from
      # the CLI into a scratch dir and directory-diff against the committed
      # lib/. A PR that noEmit-skips the build or hand-edits lib/ fails here.
      - name: committed lib matches a config-independent rebuild
        run: |
          pnpm exec tsc index.ts --outDir /tmp/lib-check --target es2023 --lib es2023 \
            --module nodenext --moduleResolution nodenext --declaration --strict \
            --verbatimModuleSyntax --skipLibCheck --types node
          diff -r lib /tmp/lib-check
      - name: built artifacts are committed
        run: git diff --exit-code -- lib/
